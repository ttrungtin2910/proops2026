# =============================================================================
# ansible.cfg — cấu hình mặc định cho project này
# =============================================================================
# Ansible đọc file này tự động nếu nó nằm cùng thư mục với lệnh bạn chạy.
# Không cần -i flag nếu inventory = inventory.ini

[defaults]
inventory        = inventory.ini          # default inventory file
remote_user      = ec2-user               # user SSH vào target
private_key_file = ~/.ssh/your-key.pem    # key mặc định
host_key_checking = False                 # bỏ qua "Are you sure (yes/no)?" lần đầu SSH

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
# Dùng trong lab/training. Production: bật host_key_checking = True.
