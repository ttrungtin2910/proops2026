# =============================================================================
# inventory.ini — danh sách hosts Ansible sẽ quản lý
# =============================================================================
# Cú pháp: alias  ansible_host=IP  ansible_user=USER  ansible_ssh_private_key_file=PATH
#
# Điền public IP từ `terraform output instance_public_ip` vào ansible_host bên dưới.
# Ansible đọc file này mỗi khi chạy — không cần restart gì.

[webservers]
ec2-day19 ansible_host=52.199.85.66 ansible_user=ec2-user ansible_ssh_private_key_file=/home/trungtin/.ssh/tin_tt33.pem

# [webservers] = tên group — dùng trong playbook để chỉ định host nào chạy task nào
# ec2-day19    = alias (tên ngắn bạn đặt — không phải hostname thật)
# ansible_host = IP thật của EC2
# ansible_user = ec2-user cho Amazon Linux 2023 (ubuntu cho Ubuntu AMI)
# ansible_ssh_private_key_file = .pem file từ AWS key pair


# =============================================================================
# Nếu sau này có nhiều server:
# =============================================================================
# [webservers]
# web-1 ansible_host=54.199.1.1 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/key.pem
# web-2 ansible_host=54.199.1.2 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/key.pem
#
# [databases]
# db-1  ansible_host=10.0.1.5   ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/key.pem
#
# Playbook có thể target: hosts: webservers, hosts: databases, hosts: all
